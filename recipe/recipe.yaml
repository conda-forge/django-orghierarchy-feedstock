# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.7.0"

package:
  name: django-orghierarchy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-orghierarchy/django_orghierarchy-${{ version }}.tar.gz
  sha256: 8cdaa2c2f6493ce95181f59d3cbb7ba6ad78c07919cb0f0290d98e179d92a8e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django-mptt
    - django >=5.2
    - djangorestframework
    - requests
    - swapper

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/City-of-Helsinki/django-orghierarchy
  license: MIT
  license_file: LICENSE
  summary: Reusable Django application for hierarchical organizations.
  description: |
    Reusable Django application for hierarchical organizations.

extra:
  recipe-maintainers:
    - rxm7706
