# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: django-orghierarchy
  version: 0.7.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 8cdaa2c2f6493ce95181f59d3cbb7ba6ad78c07919cb0f0290d98e179d92a8e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - django >=5.2
    - django-mptt
    - djangorestframework
    - requests
    - swapper
tests:
  - python:
      imports:
        - django_orghierarchy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Reusable Django application for hierarchical organizations.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/City-of-Helsinki/django-orghierarchy

extra:
  recipe-maintainers:
    - rxm7706
